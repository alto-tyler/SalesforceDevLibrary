<!-- Lookup Column Type -->
<template>
    <!-- onmousedown here (fires before blur) flags any click inside this wrapper -- the record
         picker's dropdown options and the checkbox below aren't always focusable themselves, so
         focusout() can't reliably tell "user clicked something in here" from "user left the
         cell" just by checking what's focused afterward. -->
    <div onmousedown={handleMouseDown}>
        <!-- slds-hide is used instead of template if, as it allows us to focus on the picker when the edit icon is clicked -->
        <lightning-record-picker
            label="Search"
            variant="label-hidden"
            class="slds-p-vertical_xx-small slds-p-horizontal_x-small slds-hide"
            object-api-name={objectApiName}
            value={value}
            filter={filter}
            onchange={handleChange}
            onblur={focusout}
        ></lightning-record-picker>

        <!-- The review panel (checkbox + Cancel/Apply) is only shown while editing a row that's
             part of a multi-row checkbox selection, where there's an actual decision to make
             (apply to just this row, or all N selected). A plain single-row edit commits as
             soon as a record is picked, same as before this panel existed -- no extra click
             needed for the common case. -->
        <template if:true={editMode}>
            <template if:true={isPartOfMultiSelection}>
                <div class="slds-p-horizontal_x-small slds-p-top_xx-small">
                    <lightning-input
                        type="checkbox"
                        label={applyToSelectedLabel}
                        checked={applyToSelected}
                        onchange={handleApplyToSelectedChange}
                    ></lightning-input>
                </div>
                <div class="slds-p-horizontal_x-small slds-p-vertical_x-small slds-grid slds-grid_align-end">
                    <lightning-button label="Cancel" variant="neutral" onclick={handleCancel} class="slds-m-right_x-small"></lightning-button>
                    <lightning-button label="Apply" variant="brand" onclick={handleApply}></lightning-button>
                </div>
            </template>
        </template>
    </div>

    <template if:false={editMode}>
        <div class={cellClass}>
            <div class={valueClass}>
                {displayValue}
            </div>
            <div class="slds-align-middle slds-m-left_x-small">
                <lightning-button-icon icon-name="utility:edit" size="medium" variant="bare" class="cell-icon__edit" onclick={editLookup}></lightning-button-icon>
            </div>
        </div>
    </template>
</template>
